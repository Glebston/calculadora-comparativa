<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comparativo de Taxas PagLucro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #010729;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #1a3950;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      margin: auto;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      color: #a1db00;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input, select {
      background: #fff;
      color: #000;
    }
    button {
      background: #a1db00;
      color: #010729;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #89b000;
    }
    .result {
      display: none;
      margin-top: 25px;
      background: #fff;
      color: #010729;
      border-left: 5px solid #a1db00;
      padding: 15px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .cols {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .cols > div {
      width: 48%;
    }
    .cols h3 {
      margin-top: 0;
      color: #007bff;
    }
    .economia {
      margin-top: 15px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #a1db00;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 15px; }
      .cols {
        flex-direction: column;
      }
      .cols > div {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Comparativo de Taxas PagLucro</h2>

    <label for="valor">Valor da Venda (R$):</label>
    <input 
      type="text" 
      id="valor" 
      placeholder="0,00"
      inputmode="decimal"
      pattern="[0-9]*"
    />

    <label for="meuPlano">Meu Plano:</label>
    <select id="meuPlano">
      <option>Pag Pro</option>
      <option>Pag Super</option>
      <option>Pag Lucro</option>
    </select>

    <label for="tonPlano">Plano do Ton:</label>
    <select id="tonPlano">
      <option>Ton Pro</option>
      <option>Ton Mega</option>
      <option>Ton Super</option>
    </select>

    <label for="bandeira">Bandeira:</label>
    <select id="bandeira">
      <option>Mastercard/Visa</option>
      <option>Elo</option>
    </select>

    <label for="tipo">Tipo de Pagamento:</label>
    <select id="tipo" onchange="toggleParcelas()">
      <option>Débito</option>
      <option>Crédito à Vista</option>
      <option>Crédito Parcelado</option>
    </select>

    <div id="parcelasDiv" style="display:none;">
      <label for="parcelas">Número de Parcelas:</label>
      <select id="parcelas"></select>
    </div>

    <button onclick="calcularTaxa()">Calcular</button>

    <div class="result" id="resultado"></div>
  </div>

  <script>
    // Dados das minhas taxas ATUALIZADAS
    const minhasTaxas = {
      "Pag Pro": {
        "Mastercard/Visa": { "Débito": 0.99, "Crédito à Vista": 2.99, "Crédito Parcelado": [6.24, 7.03, 7.81, 8.59, 9.36, 10.12, 10.87, 11.62, 12.36, 13.08, 13.81, 14.51, 15.22, 15.92, 16.61, 17.29, 17.96] },
        "Elo":               { "Débito": 1.10, "Crédito à Vista": 3.20, "Crédito Parcelado": [6.24, 7.03, 7.81, 8.59, 9.36, 10.12, 10.87, 11.62, 12.36, 13.08, 13.81, 14.51, 15.22, 15.92, 16.61, 17.29, 17.96] }
      },
      "Pag Super": {
        "Mastercard/Visa": { "Débito": 1.39, "Crédito à Vista": 2.91, "Crédito Parcelado": [4.56, 5.31, 6.06, 6.79, 7.53, 8.30, 9.01, 9.72, 10.42, 11.11, 11.80, 12.48, 13.15, 13.82, 14.47, 15.13, 15.77] },
        "Elo":               { "Débito": 1.45, "Crédito à Vista": 3.24, "Crédito Parcelado": [4.71, 5.46, 6.21, 6.94, 7.68, 8.50, 9.21, 9.92, 10.62, 11.31, 12.00, 12.68, 13.35, 14.02, 14.67, 15.33, 15.97] }
      },
      "Pag Lucro": {
        "Mastercard/Visa": { "Débito": 1.39, "Crédito à Vista": 2.93, "Crédito Parcelado": [4.34, 5.09, 5.84, 6.57, 7.31, 7.90, 8.61, 9.32, 10.02, 10.71, 11.40, 12.08, 12.75, 13.42, 14.07, 14.73, 15.37] },
        "Elo":               { "Débito": 1.45, "Crédito à Vista": 3.24, "Crédito Parcelado": [4.54, 5.29, 6.04, 6.77, 7.51, 8.10, 8.81, 9.52, 10.22, 10.91, 11.60, 12.28, 12.95, 13.62, 14.27, 14.93, 15.57] }
      }
    };

    // Dados das taxas do Ton
    const taxasDoTon = {
      "Ton Pro": {
        "Mastercard/Visa": { "Débito":1.45, "Crédito à Vista":3.51, "Crédito Parcelado":[6.99,6.99,7.99,9.99,10.99,11.99,11.99,12.99,13.99,14.79,14.79] },
        "Elo":               { "Débito":1.45, "Crédito à Vista":3.51, "Crédito Parcelado":[6.99,6.99,7.99,9.99,10.99,11.99,11.99,12.99,13.99,14.79,14.79] }
      },
      "Ton Mega": {
        "Mastercard/Visa": { "Débito":1.69, "Crédito à Vista":3.86, "Crédito Parcelado":[9.86,11.24,12.59,13.92,15.22,16.50,17.76,18.99,20.19,20.39,20.39] },
        "Elo":               { "Débito":1.69, "Crédito à Vista":3.86, "Crédito Parcelado":[9.86,11.24,12.59,13.92,15.22,16.50,17.76,18.99,20.19,20.39,20.39] }
      },
      "Ton Super": {
        "Mastercard/Visa": { "Débito":1.98, "Crédito à Vista":4.98, "Crédito Parcelado":[9.91,11.29,12.64,13.97,15.27,16.55,17.81,19.04,20.24,21.43,22.59] },
        "Elo":               { "Débito":1.98, "Crédito à Vista":4.98, "Crédito Parcelado":[9.91,11.29,12.64,13.97,15.27,16.55,17.81,19.04,20.24,21.43,22.59] }
      }
    };

    // Popula select de parcelas (2×–18×) - ATUALIZADO
    const selParc = document.getElementById("parcelas");
    for (let i = 2; i <= 18; i++) {
      let o = document.createElement("option");
      o.value = i;
      o.textContent = `${i}x`;
      selParc.appendChild(o);
    }

    function toggleParcelas() {
      document.getElementById("parcelasDiv").style.display =
        document.getElementById("tipo").value === "Crédito Parcelado"
          ? "block"
          : "none";
    }

    // Formata em Real
    const fmt = v =>
      new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(v);

    // Máscara de moeda
    const inp = document.getElementById("valor");
    inp.addEventListener("input", () => {
      let d = inp.value.replace(/\D/g, "");
      if (!d) { inp.value = ""; return; }
      let n = parseInt(d), c = n % 100, r = Math.floor(n / 100);
      inp.value = `${r.toLocaleString("pt-BR")},${c.toString().padStart(2, "0")}`;
    });

    function calcularTaxa() {
      let raw = inp.value.replace(/\./g, "").replace(",", ".");
      let valor = parseFloat(raw);
      if (!valor || valor <= 0) { alert("Digite um valor válido."); return; }

      let meu   = document.getElementById("meuPlano").value,
          ton   = document.getElementById("tonPlano").value,
          ban   = document.getElementById("bandeira").value,
          tipo  = document.getElementById("tipo").value,
          p     = tipo === "Crédito Parcelado" ? parseInt(selParc.value) : 1;

      let tMeu = tipo === "Crédito Parcelado"
        ? minhasTaxas[meu][ban][tipo][p - 2]
        : minhasTaxas[meu][ban][tipo];

      // Garante que a comparação com o Ton não quebre se a parcela não existir lá
      let tTon;
      if (tipo === "Crédito Parcelado") {
        const tonParcelas = taxasDoTon[ton][ban][tipo];
        tTon = p - 2 < tonParcelas.length ? tonParcelas[p - 2] : null;
      } else {
        tTon = taxasDoTon[ton][ban][tipo];
      }
      
      let resultadoHtml;
      
      if (tTon === null || tTon === undefined) {
        // Se a taxa do Ton não existe para a parcela selecionada
        const recMeu = valor * (1 - tMeu / 100);
        const cobMeu = valor / (1 - tMeu / 100);
        resultadoHtml = `
          <div class="cols">
            <div>
              <h3>Minhas Taxas</h3>
              <p>Taxa: ${tMeu.toFixed(2)}%</p>
              <p>Você recebe: ${fmt(recMeu)}</p>
              <p>Deveria cobrar: ${fmt(cobMeu)}</p>
            </div>
            <div>
              <h3>Taxas do Ton</h3>
              <p>Taxa para ${p}x não disponível no plano ${ton}.</p>
            </div>
          </div>
        `;
      } else {
        // Se ambas as taxas existem
        const recMeu      = valor * (1 - tMeu / 100),
              recTon      = valor * (1 - tTon / 100),
              cobMeu      = valor / (1 - tMeu / 100),
              cobTon      = valor / (1 - tTon / 100),
              econ        = recMeu - recTon,
              econCliente = cobTon - cobMeu;
        
        resultadoHtml = `
          <div class="cols">
            <div>
              <h3>Minhas Taxas</h3>
              <p>Taxa: ${tMeu.toFixed(2)}%</p>
              <p>Você recebe: ${fmt(recMeu)}</p>
              <p>Deveria cobrar: ${fmt(cobMeu)}</p>
            </div>
            <div>
              <h3>Taxas do Ton</h3>
              <p>Taxa: ${tTon.toFixed(2)}%</p>
              <p>Você receberia: ${fmt(recTon)}</p>
              <p>Deveria cobrar: ${fmt(cobTon)}</p>
            </div>
          </div>
          <div class="economia">
            Você economiza <strong>${fmt(econ)}</strong> comparado ao Ton!
          </div>
          ${tipo === "Crédito Parcelado" ? `
          <div class="economia">
            Seu cliente economiza <strong>${fmt(econCliente)}</strong> comparado ao Ton!
          </div>` : ``}
        `;
      }

      const out = document.getElementById("resultado");
      out.innerHTML = resultadoHtml;
      out.style.display = "block";
    }
  </script>
</body>
</html>
